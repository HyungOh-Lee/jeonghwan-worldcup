<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박정환 코스프레 월드컵</title>
<meta name="description" content="박정환 코스프레 64강 이상형 월드컵">
<meta property="og:title" content="박정환 코스프레 64강 월드컵">
<meta property="og:description" content="당신의 최애 정환을 골라주세요">
<meta property="og:image" content="img/cover.webp">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<style>
  :root {
    --bg: #0e0f14;
    --panel: #181a22;
    --line: #2a2d3a;
    --text: #f2f3f7;
    --sub: #9aa0b4;
    --gold: #f5c542;
    --red: #ff5a5f;
    --blue: #4ea1ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; cursor: pointer; border: 0; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: flex; }

  /* 시작 화면 */
  #start { flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px 16px; text-align: center;
    background: radial-gradient(ellipse at top, #2a2140 0%, var(--bg) 60%); overflow-y: auto; }
  .cover { width: min(220px, 50vw); aspect-ratio: 1; border-radius: 50%; object-fit: cover;
    border: 4px solid var(--gold); box-shadow: 0 0 40px rgba(245,197,66,.35); }
  h1 { font-size: clamp(26px, 6vw, 48px); font-weight: 900; line-height: 1.2; letter-spacing: -1px; }
  h1 em { font-style: normal; color: var(--gold); }
  .lead { color: var(--sub); font-size: clamp(14px, 3.4vw, 17px); }
  .rounds { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .rounds button { padding: 10px 18px; border-radius: 999px; background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  .rounds button.sel { background: var(--gold); color: #111; border-color: var(--gold); font-weight: 800; }
  .go { padding: 16px 48px; border-radius: 14px; background: var(--red); color: #fff; font-size: 20px; font-weight: 900;
    box-shadow: 0 8px 24px rgba(255,90,95,.35); transition: transform .15s; }
  .go:hover { transform: translateY(-2px); }
  .hof { color: var(--sub); font-size: 13px; max-width: 420px; }
  .hof b { color: var(--gold); }

  /* 대결 화면 */
  #game { flex-direction: column; }
  .bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px;
    background: rgba(0,0,0,.4); border-bottom: 1px solid var(--line); z-index: 3; }
  .bar .title { font-weight: 900; font-size: clamp(16px, 3.8vw, 22px); }
  .bar .title span { color: var(--gold); }
  .bar .count { color: var(--sub); font-size: 14px; margin-left: 8px; font-weight: 500; }
  .bar .btns { display: flex; gap: 6px; }
  .bar .btns button { padding: 7px 12px; border-radius: 8px; background: var(--panel); color: var(--text); border: 1px solid var(--line); font-size: 13px; }
  .bar .btns button:disabled { opacity: .35; cursor: default; }
  .progress { height: 3px; background: var(--line); flex: none; }
  .progress i { display: block; height: 100%; background: var(--gold); transition: width .3s; }
  .arena { flex: 1; display: flex; position: relative; min-height: 0; }
  .card { flex: 1; position: relative; overflow: hidden; cursor: pointer; min-width: 0; min-height: 0;
    transition: flex .45s ease, opacity .45s ease, filter .45s; }
  .card .blur { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover;
    filter: blur(30px) brightness(.45); }
  .card .main { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: transform .3s; }
  .card:hover .main { transform: scale(1.03); }
  .card .name { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 12px 18px; text-align: center;
    font-size: clamp(18px, 4vw, 32px); font-weight: 900; text-shadow: 0 2px 8px #000;
    background: linear-gradient(transparent, rgba(0,0,0,.8)); }
  .card.left .name { color: #ffd6d7; }
  .card.right .name { color: #d6e8ff; }
  .card.win { flex: 3; }
  .card.win .main { transform: scale(1); }
  .card.lose { flex: .0001; opacity: 0; }
  .vs { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 2; pointer-events: none;
    width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center;
    background: var(--bg); border: 3px solid var(--gold); color: var(--gold); font-weight: 900; font-size: 26px; font-style: italic;
    transition: opacity .2s; }
  .arena.picking .vs { opacity: 0; }
  .hint { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); color: var(--sub); font-size: 12px; z-index: 2; pointer-events: none; opacity: .7; }

  /* 결과 화면 */
  #result { flex-direction: column; align-items: center; justify-content: flex-start; gap: 18px; padding: 28px 16px 40px; overflow-y: auto;
    background: radial-gradient(ellipse at top, #3a2c10 0%, var(--bg) 65%); }
  .crown { font-size: 18px; letter-spacing: 6px; color: var(--gold); font-weight: 800; }
  .winner { width: min(420px, 88vw); border-radius: 18px; overflow: hidden; border: 4px solid var(--gold);
    box-shadow: 0 0 60px rgba(245,197,66,.4); background: #000; flex: none; }
  .winner img, .winner video { width: 100%; display: block; max-height: 62vh; object-fit: contain; }
  .wname { font-size: clamp(24px, 6vw, 40px); font-weight: 900; text-align: center; }
  .ranks { width: min(560px, 100%); display: grid; gap: 10px; }
  .rank { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .rank .lb { flex: none; width: 64px; text-align: center; font-weight: 800; color: var(--gold); font-size: 14px; }
  .rank .ppl { display: flex; gap: 8px; flex-wrap: wrap; }
  .rank .p { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 76px; font-size: 12px; text-align: center; color: var(--sub); }
  .rank .p img, .rank .p video { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: #000; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .actions button { padding: 14px 28px; border-radius: 12px; font-weight: 800; font-size: 16px; }
  .actions .again { background: var(--red); color: #fff; }
  .actions .home { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  .confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 5; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  /* 세로 화면(휴대폰)은 위아래로 */
  @media (max-aspect-ratio: 1/1) {
    .arena { flex-direction: column; }
    .vs { width: 58px; height: 58px; font-size: 20px; }
    .card .name { padding: 30px 10px 12px; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<section id="start" class="screen on">
  <img class="cover" src="img/cover.webp" alt="박정환 책임">
  <h1>박정환 <em>코스프레</em><br>월드컵</h1>
  <p class="lead">당신의 최애 정환을 골라주세요</p>
  <div class="rounds" id="rounds"></div>
  <button class="go" id="goBtn">시작하기</button>
  <p class="hof" id="hof"></p>
</section>

<section id="game" class="screen">
  <div class="bar">
    <div class="title"><span id="roundName">64강</span><span class="count" id="count"></span></div>
    <div class="btns">
      <button id="undoBtn">되돌리기</button>
      <button id="quitBtn">처음으로</button>
    </div>
  </div>
  <div class="progress"><i id="prog"></i></div>
  <div class="arena" id="arena">
    <div class="card left" id="cardL"></div>
    <div class="vs">VS</div>
    <div class="card right" id="cardR"></div>
    <div class="hint">클릭 또는 ← → 키로 선택</div>
  </div>
</section>

<section id="result" class="screen">
  <div class="crown">CHAMPION</div>
  <div class="winner" id="winBox"></div>
  <div class="wname" id="winName"></div>
  <div class="ranks" id="ranks"></div>
  <div class="actions">
    <button class="again" id="againBtn">다시 하기</button>
    <button class="home" id="homeBtn">처음으로</button>
  </div>
</section>

<script src="data.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const SIZES = [64, 32, 16, 8].filter(n => n <= CANDIDATES.length);
  let size = SIZES[0];
  let S = null;          // 진행 상태
  let history = [];      // 되돌리기용
  let busy = false;

  const store = {
    get() { try { return JSON.parse(localStorage.getItem('jh_wc_wins') || '{}'); } catch (e) { return {}; } },
    add(name) { try { const w = store.get(); w[name] = (w[name] || 0) + 1; localStorage.setItem('jh_wc_wins', JSON.stringify(w)); } catch (e) {} }
  };

  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const roundLabel = n => n === 2 ? '결승' : n === 4 ? '준결승' : n + '강';

  function media(c, cls) {
    if (c.video) return `<video class="${cls}" src="${c.src}" autoplay muted loop playsinline></video>`;
    return `<img class="${cls}" src="${c.src}" alt="" draggable="false">`;
  }

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  }

  function renderStart() {
    $('rounds').innerHTML = SIZES.map(n => `<button data-n="${n}" class="${n === size ? 'sel' : ''}">${n}강</button>`).join('');
    const w = Object.entries(store.get()).sort((a, b) => b[1] - a[1]).slice(0, 3);
    $('hof').innerHTML = w.length ? '이 기기 역대 우승: ' + w.map(([n, c]) => `<b>${esc(n)}</b> ${c}회`).join(' · ') : '';
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }

  function start() {
    S = { cur: shuffle(CANDIDATES).slice(0, size), next: [], i: 0, out: {} };
    history = [];
    show('game');
    renderMatch();
  }

  function renderMatch() {
    const n = S.cur.length, a = S.cur[S.i], b = S.cur[S.i + 1];
    $('roundName').textContent = roundLabel(n);
    $('count').textContent = n > 2 ? `${S.i / 2 + 1} / ${n / 2}` : '';
    const done = size - S.cur.length + S.i / 2;   // 지금까지 치른 경기 수
    $('prog').style.width = (done / (size - 1) * 100) + '%';
    $('undoBtn').disabled = history.length === 0;
    $('arena').classList.remove('picking');
    [[$('cardL'), a], [$('cardR'), b]].forEach(([el, c]) => {
      el.className = el.id === 'cardL' ? 'card left' : 'card right';
      el.innerHTML = (c.video ? '' : media(c, 'blur')) + media(c, 'main') + `<div class="name">${esc(c.name)}</div>`;
    });
    preload();
    busy = false;
  }

  function preload() {
    [S.cur[S.i + 2], S.cur[S.i + 3]].forEach(c => { if (c && !c.video) new Image().src = c.src; });
  }

  function pick(side) {
    if (busy || !S) return;
    busy = true;
    history.push(JSON.stringify(S));
    const win = S.cur[S.i + side], lose = S.cur[S.i + 1 - side];
    const n = S.cur.length;
    (S.out[n] = S.out[n] || []).push(lose);
    S.next.push(win);
    $('arena').classList.add('picking');
    $(side ? 'cardR' : 'cardL').classList.add('win');
    $(side ? 'cardL' : 'cardR').classList.add('lose');
    setTimeout(() => {
      S.i += 2;
      if (S.i >= S.cur.length) {
        if (S.next.length === 1) return finish(S.next[0]);
        S.cur = S.next; S.next = []; S.i = 0;
      }
      renderMatch();
    }, 700);
  }

  function undo() {
    if (busy || !history.length) return;
    S = JSON.parse(history.pop());
    renderMatch();
  }

  function finish(w) {
    store.add(w.name);
    $('winBox').innerHTML = media(w, '');
    $('winName').textContent = w.name;
    const rows = [[2, '준우승'], [4, '4강'], [8, '8강']].filter(([k]) => S.out[k]);
    $('ranks').innerHTML = rows.map(([k, lb]) => `<div class="rank"><div class="lb">${lb}</div><div class="ppl">${
      S.out[k].map(c => `<div class="p">${media(c, '')}<span>${esc(c.name)}</span></div>`).join('')}</div></div>`).join('');
    show('result');
    confetti();
  }

  function confetti() {
    const colors = ['#f5c542', '#ff5a5f', '#4ea1ff', '#7be495', '#c08cff'];
    for (let i = 0; i < 120; i++) {
      const d = document.createElement('div');
      d.className = 'confetti';
      d.style.left = Math.random() * 100 + 'vw';
      d.style.background = colors[i % colors.length];
      d.style.animationDuration = 2 + Math.random() * 2.5 + 's';
      d.style.animationDelay = Math.random() * .8 + 's';
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 6000);
    }
  }

  function home() { S = null; renderStart(); show('start'); }

  $('rounds').addEventListener('click', e => { const n = +e.target.dataset.n; if (n) { size = n; renderStart(); } });
  $('goBtn').addEventListener('click', start);
  $('cardL').addEventListener('click', () => pick(0));
  $('cardR').addEventListener('click', () => pick(1));
  $('undoBtn').addEventListener('click', undo);
  $('quitBtn').addEventListener('click', () => { if (confirm('처음으로 돌아갈까요? 진행 중인 결과는 사라집니다.')) home(); });
  $('againBtn').addEventListener('click', start);
  $('homeBtn').addEventListener('click', home);
  document.addEventListener('keydown', e => {
    if (!$('game').classList.contains('on')) return;
    if (e.key === 'ArrowLeft') pick(0);
    else if (e.key === 'ArrowRight') pick(1);
    else if (e.key === 'Backspace') undo();
  });

  renderStart();
})();
</script>
</body>
</html>
